<path class="flow" d="M200 315 L232 315"/>
<path class="flow" d="M420 280 C440 280 435 215 452 215"/>
<path class="flow" d="M420 350 C440 350 435 415 452 415"/>
<path class="flow" d="M690 215 L722 215"/>
<path class="flow" d="M690 415 L722 415"/>
<path class="flow" d="M940 215 L972 215"/>
<path class="flow" d="M940 415 L972 415"/>
<path class="flow" d="M327 410 L327 630 L452 630"/>
<path class="plan" d="M832 490 L832 567"/>
<path class="plan" d="M1060 490 L1060 567"/>
</svg>
