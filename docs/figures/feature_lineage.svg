<text x="364" y="684.0" class="tag" style="fill:#2a78d6" text-anchor="start">B</text>
<text x="382" y="684.0" class="b" text-anchor="start">fallbacks + 36 formulas (loan, income ratios)</text>
<text x="364" y="704.0" class="tag" style="fill:#eb6834" text-anchor="start">A</text>
