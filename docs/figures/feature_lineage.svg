<text x="364" y="772.0" class="tag" style="fill:#2a78d6" text-anchor="start">B</text>
<text x="382" y="772.0" class="b" text-anchor="start">6 fallbacks + 1 ratio</text>
<text x="364" y="792.0" class="tag" style="fill:#eb6834" text-anchor="start">A</text>
<text x="382" y="792.0" class="b" text-anchor="start">columns kept as they are</text>
