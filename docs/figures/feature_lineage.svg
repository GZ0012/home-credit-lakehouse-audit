<text x="495" y="398.0" class="m" text-anchor="start">→ train_applprev_2_features</text>
<text x="364" y="420.0" class="tag" style="fill:#2a78d6" text-anchor="start">B</text>
<text x="382" y="420.0" class="b" text-anchor="start">contacts and cards of previous applications, 4 aggregations</text>
<text x="364" y="440.0" class="tag" style="fill:#eb6834" text-anchor="start">A</text>
<text x="382" y="440.0" class="b" text-anchor="start">only the row-count (num_group max)</text>
