<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="1188" viewBox="0 0 1540 1188" role="img" aria-labelledby="t d">
<title id="t">Feature lineage of both systems</title>
<desc id="d">17 bronze training tables feed 10 silver scripts. Each script is built twice, once per system: B replicates Volkova's DataProcessor2, A is the yuuniee stand-in (DataProcessor5). Each system's 10 silver tables are left-joined on case_id into its gold training table.</desc>
<defs><marker id="a" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#52514e"/></marker></defs>
<style>
  text{font-family:Helvetica,Arial,sans-serif;fill:#0b0b0b}
  .h{font-size:17px;font-weight:700}
  .b{font-size:13.5px;fill:#52514e}
  .tag{font-size:14px;font-weight:700}
  .m{font-family:Menlo,Consolas,monospace;font-size:12.5px;fill:#52514e}
  .mb{font-family:Menlo,Consolas,monospace;font-size:14px;font-weight:700;fill:#0b0b0b}
  .lane{font-size:13px;font-weight:700;fill:#52514e;letter-spacing:1px}
  .flow{stroke:#8f8e88;stroke-width:1.5;fill:none;marker-end:url(#a)}
</style>
<rect width="1540" height="1188" fill="#fcfcfb"/>
<text x="40" y="50" style="font-size:26px;font-weight:700">Feature lineage: bronze → silver → gold, for both systems</text>
<text x="40" y="78" class="b">The same 10 silver scripts exist twice: silver/volkova/ (System B) and silver/yuuniee/ (System A). Each turns its bronze tables into one row per case.</text>
<text x="40" y="100" class="b"><tspan font-weight="700" fill="#2a78d6">B</tspan> = replication of Volkova's DataProcessor2 (commit d5e228c).  <tspan font-weight="700" fill="#eb6834">A</tspan> = yuuniee stand-in: Volkova's DataProcessor5, because yuuniee's feature code is not public.</text>
<text x="40" y="170" class="lane">BRONZE · 17 TRAINING TABLES</text>
<text x="350" y="170" class="lane">SILVER · SCRIPT → TABLE (silver_volkova.* and silver_yuuniee.*)</text>
<text x="1160" y="170" class="lane">GOLD · ONE TABLE PER SYSTEM</text>
<rect x="40" y="224.0" width="250" height="26" rx="5" fill="#ffffff" stroke="#8f8e88"/>
<text x="50" y="241.5" class="m" text-anchor="start">train_base</text>
<path class="flow" d="M290 237.0 C320 237.0 320 237.0 347 237.0"/>
<rect x="350" y="200.0" width="720" height="74" rx="8" fill="#ffffff" stroke="#8f8e88"/>
<text x="364" y="222.0" class="mb" text-anchor="start">01_case_sources</text>
<text x="513" y="222.0" class="m" text-anchor="start">→ train_case_sources</text>
<text x="364" y="244.0" class="tag" style="fill:#2a78d6" text-anchor="start">B</text>
<text x="382" y="244.0" class="b" text-anchor="start">base cases + applicant / static columns, fallbacks (coalesce)</text>
<text x="364" y="264.0" class="tag" style="fill:#eb6834" text-anchor="start">A</text>
<text x="382" y="264.0" class="b" text-anchor="start">base cases only, date_decision as date</text>
<path d="M1070 237.0 L1115 237.0" stroke="#8f8e88" stroke-width="1.5" fill="none"/>
<rect x="40" y="312.0" width="250" height="26" rx="5" fill="#ffffff" stroke="#8f8e88"/>
<text x="50" y="329.5" class="m" text-anchor="start">train_applprev_1</text>
<path class="flow" d="M290 325.0 C320 325.0 320 325.0 347 325.0"/>
<rect x="350" y="288.0" width="720" height="74" rx="8" fill="#ffffff" stroke="#8f8e88"/>
<text x="364" y="310.0" class="mb" text-anchor="start">02_applprev_1</text>
<text x="495" y="310.0" class="m" text-anchor="start">→ train_applprev_1_features</text>
<text x="364" y="332.0" class="tag" style="fill:#2a78d6" text-anchor="start">B</text>
<text x="382" y="332.0" class="b" text-anchor="start">last application row; all / approved / last 5 years aggregations; formulas</text>
<text x="364" y="352.0" class="tag" style="fill:#eb6834" text-anchor="start">A</text>
<text x="382" y="352.0" class="b" text-anchor="start">mean / max / var over all previous applications</text>
<path d="M1070 325.0 L1115 325.0" stroke="#8f8e88" stroke-width="1.5" fill="none"/>
<rect x="40" y="400.0" width="250" height="26" rx="5" fill="#ffffff" stroke="#8f8e88"/>
<text x="50" y="417.5" class="m" text-anchor="start">train_applprev_2</text>
<path class="flow" d="M290 413.0 C320 413.0 320 413.0 347 413.0"/>
<rect x="350" y="376.0" width="720" height="74" rx="8" fill="#ffffff" stroke="#8f8e88"/>
